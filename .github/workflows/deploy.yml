name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 1. GitHub Pages (site estático) ────────────────────────
  deploy-pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar pasta frontend no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Usa PAT pessoal para contornar política de permissão da organização.
          # Secret DEPLOY_TOKEN: github.com/settings/tokens → escopo "repo"
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./frontend
          force_orphan: false
          exclude_assets: 'dist'

  # ── 2. Firebase Cloud Functions (OG proxy WhatsApp) ────────
  deploy-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    # Mapeia o secret para env: o contexto `secrets` não pode ser usado em
    # condições `if`. Os steps abaixo só rodam se FIREBASE_TOKEN estiver setado,
    # permitindo o site funcionar mesmo sem as functions configuradas.
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        if: ${{ env.FIREBASE_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: ${{ env.FIREBASE_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências das functions
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npm install
        working-directory: functions

      - name: Deploy Firebase Functions
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx firebase-tools deploy --only functions --non-interactive
        working-directory: functions
