<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: dark burgundy red -->
  <rect width="100" height="100" rx="18" fill="#6B1622"/>
  <!-- "R": white, bold Georgia -->
  <text
    x="10" y="80"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="76"
    fill="#FFFFFF"
  >R</text>
  <!-- "i": gold accent, italic -->
  <text
    x="63" y="80"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="50"
    fill="#C4A26B"
  >i</text>
</svg>
